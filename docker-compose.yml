version: '3.8'

services:
  frontfix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontfix-ai-assistant
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
