<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      font-size: 12px;
    }
    .btn:hover {
      background: #0369a1;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="color: #38bdf8;">FrontFix AI</strong>
    <span class="badge">Team B</span>
  </div>
  <p class="desc">
    Active listener capturing <code>console.error</code> and <code>unhandledrejection</code> events in current tab.
  </p>
  <button class="btn" id="open-studio">Launch Diagnostic Studio</button>
  <script>
    document.getElementById('open-studio').addEventListener('click', () => {
      chrome.tabs.create({ url: 'http://127.0.0.1:8000/' });
    });
  </script>
</body>
</html>
